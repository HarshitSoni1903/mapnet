[project]
name = "mapnet"
version = "2.0.0.dev0"
description = "An aggregator for biomedical ontology mapping tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bioregistry>=0.14.0",
    "curies>=0.10.0",
    "pydantic>=2.0",
    "pystow>=0.5.0",
    "sssom-pydantic>=0.6.1",
]

[project.scripts]
mapnet = "mapnet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
